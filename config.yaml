outputs:
  home: ["HTML", "RSS", "JSON"]
  page: ["HTML", "RSS"]

enableRobotsTXT: true

pagination:
  pagerSize: 6

markup:
  goldmark:
    renderer:
      unsafe: true

# 全局默认参数（主要为英文默认显示设置）
params:
  title: "Colab"
  description: "Colab Lab — UAV • Manipulation • Spacecraft"
  favicon: "/images/cologo.png"
  staticPath: ""

  useBootstrapCDN: false
  mathjax: false
  animate: true

  theme:
    defaultTheme: "dark"
    disableThemeToggle: true

  navbar:
    align: ms-auto
    brandName: "Colab"
    disableSearch: true
    stickyNavBar:
      enable: true
      showOnScrollUp: true
    enableSeparator: false
    menus:
      disableAbout: true
      disableExperience: true
      disableEducation: true
      disableProjects: true
      disableAchievements: true
      disableContact: true
  customCSS:
    - "css/custom.css"
  customScripts: "<script src=\"/js/custom.js\"></script>"

  # 首页 Hero (英文默认)
  hero:
    enable: true
    intro: "Welcome to"
    title: "Colab"
    subtitle: "Aerospace Embodied Intelligence Laboratory"
    content: "CoLab (Cola Laboratory, 可乐实验室) was founded on June 12, 2016. Our current research focuses on embodied intelligence in real-world environments, with emphasis on UAV, VLA, and multimodal video understanding. We also study 3D perception for autonomous agents and intelligent scheduling for satellite constellations, building AI agents that can perceive, reason, and act across air-space-ground scenarios."
    bottomImage:
      enable: false
    button:
      enable: true
      name: "Explore"
      url: "#projects"
      download: false
      newPage: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/buaa-colalab
        - icon: fas fa-envelope
          url: "mailto:colab_buaa@163.com"
      customIcons:
        - icon: /images/wechat-icon.png
          url: "#"

  about:
    enable: false

  # 首页展示"代表作"卡片 (中英共享具体的items内容)
  projects:
    enable: true
    title: "Representative Works"
    items:
      - title: "ManiSoft: Towards Vision-Language Manipulation for Soft Continuum Robotics"
        content: "ManiSoft opens a simulator, benchmark, 6,300 expert trajectories, and a vision-language policy stack for soft continuum robot manipulation."
        image: "https://buaa-colalab.github.io/ManiSoft/media/images/fig1.png"
        links:
          - name: "Paper"
            url: "https://arxiv.org/abs/2605.18617"
          - name: "Project"
            url: "https://buaa-colalab.github.io/ManiSoft/"
          - name: "Code"
            url: "https://github.com/buaa-colalab/ManiSoft"
          - name: "Dataset"
            url: "https://huggingface.co/datasets/JobsWei/ManiSoft"
        badges: ["Embodied AI", "Robotics", "Dataset", "ICML 2026"]
      - title: "GAGeo: Geometry-Aware Cross-View Object Geo-Localization"
        content: "GAGeo unifies geometry-aware object localization across ground, drone, and satellite views and introduces CMA-Loc with 223,767 cross-view pairs."
        image: "https://cipual.github.io/GAGeo-project-page/static/images/paper-teaser.png"
        links:
          - name: "Paper"
            url: "https://arxiv.org/abs/2606.30576"
          - name: "Project"
            url: "https://cipual.github.io/GAGeo-project-page/"
          - name: "Code"
            url: "https://github.com/buaa-colalab/GAGeo"
          - name: "Dataset"
            url: "https://huggingface.co/datasets/cipual/CMA-Loc"
        badges: ["Cross-View", "Geo-Localization", "Dataset", "ECCV 2026"]
      - title: "TopoGPT: Generative Lane Topology Reasoning with Geometry Prior"
        content: "TopoGPT formulates lane topology reasoning as autoregressive graph generation and pre-trains on 3.3 million lane-graph scenes gathered from map-rich motion datasets."
        image: "https://buaa-colalab.github.io/topogpt_page/static/images/overview_visual_input.png"
        links:
          - name: "Paper"
            url: "https://arxiv.org/abs/2606.31814"
          - name: "Project"
            url: "https://buaa-colalab.github.io/topogpt_page/"
          - name: "Code"
            url: "https://github.com/buaa-colalab/TopoGPT"
        badges: ["Autonomous Driving", "Lane Topology", "Generative Model", "ECCV 2026"]
      - title: "SVCBench: A Streaming Video Counting Benchmark for Spatial-Temporal State Maintenance"
        content: "SVCBench evaluates whether multimodal models can maintain spatial-temporal state and perform fine-grained counting in streaming video."
        image: "https://buaa-colalab.github.io/SVCBench/assets/cover/cover_1.png"
        links:
          - name: "Paper"
            url: "https://arxiv.org/abs/2603.12703"
          - name: "Project"
            url: "https://buaa-colalab.github.io/SVCBench/"
          - name: "Code"
            url: "https://github.com/buaa-colalab/SVCBench"
          - name: "Dataset"
            url: "https://huggingface.co/datasets/buaaplay/SVCBench"
        badges: ["Video Understanding", "Counting", "Benchmark", "ECCV 2026"]
      - title: "ViSTR-Bench: Continuous Visual-Cue Reasoning in Dynamic Scenes"
        content: "ViSTR-Bench offers 15 subtasks and 1,340 visual question-answer pairs to test whether MLLMs can track continuously evolving evidence in dynamic scenes."
        image: "https://buaa-colalab.github.io/vistr-bench-page/static/images/task-definition-1.png"
        links:
          - name: "Paper"
            url: "https://arxiv.org/abs/2607.20868"
          - name: "Project"
            url: "https://buaa-colalab.github.io/vistr-bench-page/"
          - name: "Code"
            url: "https://github.com/buaa-colalab/ViSTR-Bench"
          - name: "Dataset"
            url: "https://huggingface.co/datasets/homothetic/ViSTR-Bench-Public"
        badges: ["MLLM", "Video Reasoning", "Dataset", "arXiv 2026"]
      - title: "EVA-Client: Unified Real-Robot Data Collection, Inference, and Deployment"
        content: "EVA-Client brings data collection, policy inference, evaluation, and real-robot deployment into one open framework for embodied-AI experiments."
        image: "https://colalab.net/projects/eva-client/assets/demos/poster.jpg"
        links:
          - name: "Paper"
            url: "https://arxiv.org/abs/2607.02646"
          - name: "Project"
            url: "https://colalab.net/projects/eva-client"
          - name: "Code"
            url: "https://github.com/Noietch/EVA-CLIENT"
        badges: ["Embodied AI", "Robotics", "Open Platform", "arXiv 2026"]
      - title: "GE-Sim 2.0: Comprehensive Closed-Loop Video World Simulation for Robotic Manipulation"
        content: "GE-Sim 2.0 is an open closed-loop video world simulator for robotic manipulation with action-conditioned generation, WorldArena evaluation, and fast interactive rollout."
        demo: "https://ge-sim-v2.github.io/assets/converted/GE.mp4"
        links:
          - name: "Paper"
            url: "https://arxiv.org/abs/2605.27491"
          - name: "Project"
            url: "https://ge-sim-v2.github.io/"
          - name: "Code"
            url: "https://github.com/AgibotTech/GE-Sim-V2"
          - name: "Model"
            url: "https://huggingface.co/agibot-world/Genie-Envisioner-Sim-v2.0"
        badges: ["Embodied AI", "World Model", "Simulation Platform", "arXiv 2026"]
      - title: "UAVClaw: Autonomous UAV Agent for Real-World Tasks"
        content: "UAVClaw brings OpenClaw task planning to real-world UAV autonomy, enabling drones to understand goals and execute tasks in open environments."
        image: /images/works/uavclaw.jpg
        demo: /demos/UAVClaw.mp4
        links:
          - name: "Project"
            url: "https://prince687028.github.io/UAV-Claw/"
        badges: ["UAV", "Embodied AI", "OpenClaw"]
      - title: "Towards Realistic Earth-Observation Constellation Scheduling: Benchmark and Methodology"
        content: "Towards Realistic Earth-Observation Constellation Scheduling: Benchmark and Methodology"
        image: /images/works/satellite.png
        demo: /demos/AEOSBench.mp4
        links:
          - name: "Paper"
            url: "https://arxiv.org/pdf/2510.26297"
          - name: "Project"
            url: "https://buaa-colalab.github.io/AEOSBench/"
          - name: "Code"
            url: "https://github.com/buaa-colalab/AEOSBench"
        badges: ["Satellite", "Scheduling", "Benchmark"]
      - title: "\"Hi AirStar, Guide Me to the Badminton Court.\""
        content: "\"Hi AirStar, Guide Me to the Badminton Court.\""
        image: 
        demo: /demos/airstar.gif
        links:
          - name: "Paper"
            url: "https://arxiv.org/pdf/2507.04430"
