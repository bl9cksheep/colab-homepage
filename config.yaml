        - identifier: platforms-datasets
          name: Platforms&Datasets
          title: Platforms & Datasets
          url: /platforms-datasets/
          weight: 3
        - identifier: team
          name: Team
          title: Team Photo
          url: /team/
          weight: 4
        - identifier: join-us
          name: Join Us
          title: Join Us
          url: /join-us/
          weight: 5

  zh:
    languageCode: "zh-cn"
    languageName: "中文"
    weight: 2
    # 中文导航菜单
    Menus:
      main:
        - identifier: lang-en
          name: "🌐 EN/中"
          url: /
          weight: 1
        - identifier: publications
          name: 发表论文
          url: /zh/publications/
          weight: 2
        - identifier: platforms-datasets
          name: 平台与数据集
          url: /zh/platforms-datasets/
          weight: 3
        - identifier: team
          name: 实验室队伍
          url: /zh/team/
          weight: 4
        - identifier: join-us
          name: 加入我们
          url: /zh/join-us/
          weight: 5
    # 中文页面定制内容(覆盖全局默认参数)
    params:
      hero:
        intro: "欢迎来到"
        title: "Colab"
        subtitle: "空天具身智能实验室"
        content: "CoLab（可乐实验室）成立于2016年6月12日。我们当前聚焦真实环境中的具身智能，重点方向包括UAV、VLA与多模态视频理解。同时，我们也开展面向自主智能体的三维感知与卫星星座智能调度研究，致力于构建能够在空-天-地场景中感知、推理与执行的智能体。"
        button:
          name: "立即探索"
          url: "#projects"
          enable: true
      projects:
        title: "代表性工作"
        items:
          - title: "ManiSoft：面向软体连续机器人的视觉语言操作"
            content: "ManiSoft 开源了面向软体连续机器人的仿真器、基准、6,300 条专家轨迹以及视觉语言操作策略工具链。"
            image: "https://buaa-colalab.github.io/ManiSoft/media/images/fig1.png"
            links:
              - name: "论文"
                url: "https://arxiv.org/abs/2605.18617"
              - name: "项目"
                url: "https://buaa-colalab.github.io/ManiSoft/"
              - name: "代码"
                url: "https://github.com/buaa-colalab/ManiSoft"
              - name: "数据集"
                url: "https://huggingface.co/datasets/JobsWei/ManiSoft"
            badges: ["具身智能", "机器人", "数据集", "ICML 2026"]
          - title: "GAGeo：面向几何感知跨视角目标地理定位的统一单阶段框架"
            content: "GAGeo 统一地面、无人机与卫星视角的几何感知目标定位，并推出包含 223,767 对跨视角数据的 CMA-Loc 基准。"
            image: "https://cipual.github.io/GAGeo-project-page/static/images/paper-teaser.png"
            links:
              - name: "论文"
                url: "https://arxiv.org/abs/2606.30576"
              - name: "项目"
                url: "https://cipual.github.io/GAGeo-project-page/"
              - name: "代码"
                url: "https://github.com/buaa-colalab/GAGeo"
              - name: "数据集"
                url: "https://huggingface.co/datasets/cipual/CMA-Loc"
            badges: ["跨视角", "地理定位", "数据集", "ECCV 2026"]
          - title: "TopoGPT：基于几何先验自回归模型的生成式车道拓扑推理"
            content: "TopoGPT 将车道拓扑推理建模为自回归图生成，并从多个地图数据集收集 330 万个车道图场景用于预训练。"
            image: "https://buaa-colalab.github.io/topogpt_page/static/images/overview_visual_input.png"
            links:
              - name: "论文"
                url: "https://arxiv.org/abs/2606.31814"
              - name: "项目"
                url: "https://buaa-colalab.github.io/topogpt_page/"
              - name: "代码"
                url: "https://github.com/buaa-colalab/TopoGPT"
            badges: ["自动驾驶", "车道拓扑", "生成模型", "ECCV 2026"]
          - title: "SVCBench：面向时空状态维护的流式视频计数基准"
            content: "SVCBench 面向流式视频场景，评测多模态模型在长时间上下文中持续维护时空状态并完成细粒度计数的能力。"
            image: "https://buaa-colalab.github.io/SVCBench/assets/cover/cover_1.png"
            links:
              - name: "论文"
                url: "https://arxiv.org/abs/2603.12703"
              - name: "项目"
                url: "https://buaa-colalab.github.io/SVCBench/"
              - name: "代码"
                url: "https://github.com/buaa-colalab/SVCBench"
              - name: "数据集"
                url: "https://huggingface.co/datasets/buaaplay/SVCBench"
            badges: ["视频理解", "计数", "基准", "ECCV 2026"]
          - title: "ViSTR-Bench：动态场景连续视觉线索推理基准"
            content: "ViSTR-Bench 包含 15 个子任务和 1,340 组视觉问答，用于评测多模态大模型能否跟踪动态场景中持续演化的视觉证据。"
            image: "https://buaa-colalab.github.io/vistr-bench-page/static/images/task-definition-1.png"
            links:
              - name: "论文"
                url: "https://arxiv.org/abs/2607.20868"
              - name: "项目"
                url: "https://buaa-colalab.github.io/vistr-bench-page/"
              - name: "代码"
                url: "https://github.com/buaa-colalab/ViSTR-Bench"
              - name: "数据集"
                url: "https://huggingface.co/datasets/homothetic/ViSTR-Bench-Public"
            badges: ["多模态大模型", "视频推理", "数据集", "arXiv 2026"]
          - title: "EVA-Client：真实机器人具身策略的统一数据采集、推理与部署框架"
            content: "EVA-Client 将数据采集、策略推理、评测与真机部署整合到统一开源框架，降低具身智能实验的工程成本。"
            image: "https://colalab.net/projects/eva-client/assets/demos/poster.jpg"
            links:
              - name: "论文"
                url: "https://arxiv.org/abs/2607.02646"
              - name: "项目"
                url: "https://colalab.net/projects/eva-client"
              - name: "代码"
                url: "https://github.com/Noietch/EVA-CLIENT"
            badges: ["具身智能", "机器人", "开源平台", "arXiv 2026"]
          - title: "GE-Sim 2.0：面向机器人操作的综合闭环视频世界仿真器"
            content: "GE-Sim 2.0 是面向机器人操作的开源闭环视频世界仿真器，集成动作条件生成、WorldArena 评测与快速交互式 rollout。"
            demo: "https://ge-sim-v2.github.io/assets/converted/GE.mp4"
            links:
              - name: "论文"
                url: "https://arxiv.org/abs/2605.27491"
              - name: "项目"
                url: "https://ge-sim-v2.github.io/"
              - name: "代码"
                url: "https://github.com/AgibotTech/GE-Sim-V2"
              - name: "模型"
                url: "https://huggingface.co/agibot-world/Genie-Envisioner-Sim-v2.0"
            badges: ["具身智能", "世界模型", "仿真平台", "arXiv 2026"]
          - title: "UAVClaw：面向真实任务的自主无人机智能体"
            content: "UAVClaw 将 OpenClaw 的任务规划能力扩展到真实无人机场景，使无人机能够理解开放环境中的目标并自主执行任务。"
            image: /images/works/uavclaw.jpg
            demo: /demos/UAVClaw.mp4
            links:
              - name: "项目"
                url: "https://prince687028.github.io/UAV-Claw/"
            badges: ["无人机", "具身智能", "OpenClaw"]
          - title: "面向真实地球观测星座调度：基准与方法"
            content: "该工作面向真实地球观测星座调度，构建贴近实际约束的基准与方法，用于评估和推动大规模卫星任务规划研究。"
            image: /images/works/satellite.png
            demo: /demos/AEOSBench.mp4
            links:
              - name: "论文"
                url: "https://arxiv.org/pdf/2510.26297"
              - name: "项目"
                url: "https://buaa-colalab.github.io/AEOSBench/"
              - name: "代码"
                url: "https://github.com/buaa-colalab/AEOSBench"
            badges: ["卫星", "调度", "基准"]
          - title: "\"Hi AirStar, Guide Me to the Badminton Court.\""
            content: "AirStar 展示了无人机在真实环境中基于自然语言指令进行导航与交互的能力。"
            image:
            demo: /demos/airstar.gif
            links:
              - name: "论文"
                url: "https://arxiv.org/pdf/2507.04430"
              - name: "项目"
                url: "https://buaa-colalab.github.io/airstar.github.io/"
              - name: "代码"
                url: "https://buaa-colalab.github.io/airstar.github.io/"
            badges: ["具身智能", "无人机", "导航", "MM2025 Demo"]
          - title: "UAV-Flow Colosseo：面向真实世界飞行的无人机模仿学习基准"
            content: "UAV-Flow Colosseo 面向真实无人机飞行任务，提供视频驱动的模仿学习基准与评测环境。"
            image: /images/works/uav-flow.png
            demo: /demos/UAV-Flow.mp4
            links:
              - name: "论文"
                url: "https://arxiv.org/pdf/2505.15725"
              - name: "项目"
                url: "https://prince687028.github.io/UAV-Flow/"
              - name: "代码"
                url: "https://github.com/buaa-colalab/UAV-Flow"
            badges: ["无人机", "模仿学习", "基准"]
          - title: "RoboCerebra：长程机器人操作评测的大规模基准"
            content: "RoboCerebra 构建了面向长程机器人操作任务的大规模评测基准，用于系统评估机器人规划与执行能力。"
            image:
            demo: /demos/RoboCerebra.gif
            links:
              - name: "论文"
                url: "https://arxiv.org/abs/2506.06677"
              - name: "项目"
                url: "https://robocerebra.github.io/"
              - name: "代码"
                url: "https://github.com/qiuboxiang/RoboCerebra"
            badges: ["机器人", "数据集", "具身智能", "NeurIPS 2025"]
      achievements:
        title: "新闻动态"

title: "Colab"
